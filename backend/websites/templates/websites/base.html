<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

 <title>Divisha Tenant Admin</title>

 <style>


<style>
body{margin:0;background:#f1f5f4;color:#142d2a;font:16px system-ui}
main{max-width:46rem;margin:3rem auto;padding:2rem;background:white;border-radius:1rem}
a{color:#075e51} input,textarea{display:block;max-width:100%;box-sizing:border-box;padding:.55rem}
button{background:#075e51;color:white;border:0;border-radius:.4rem;padding:.65rem 1rem;cursor:pointer}

{% comment %} nav{display:flex;justify-content:space-between;align-items:center} {% endcomment %}
.panel-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: .5rem 1rem;
  padding-bottom: .75rem;
  border-bottom: 1px solid #d6e3df;
}

.panel-nav a,
.panel-nav button {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  box-sizing: border-box;
}

.panel-nav a {
  font-weight: 600;
}

.panel-nav form {
  margin: 0;
}

.panel-nav :focus-visible {
  outline: 2px solid #075e51;
  outline-offset: 3px;
}

</style>
<main>
{% if user.is_authenticated %}


<nav class="panel-nav" aria-label="Tenant admin">
  <a href="{% url 'panel-index' %}">Your websites</a>

  <form action="{% url 'panel-logout' %}" method="post">
    {% csrf_token %}
    <button type="submit">Sign out button</button>
  </form>
</nav>

{% endif %}
{% block content %}{% endblock %}
</main>
</html>
