services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${PGDATABASE:-divisha}
      POSTGRES_USER: ${PGUSER:-divisha}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD for the local database}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
